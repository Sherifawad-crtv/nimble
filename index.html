<!doctype html>
<html lang="en" dir="ltr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#141414" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nimble" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <title>Nimble</title>
    <script>
      // Boot check: if the app script fails to load or start, show why instead of a blank screen.
      (function () {
        var first = null;
        function note(msg) { if (!first) first = String(msg || 'Unknown error'); }
        window.addEventListener('error', function (e) { note(e.message || (e.target && e.target.src ? 'Failed to load ' + e.target.src : '')); }, true);
        window.addEventListener('unhandledrejection', function (e) { note(e.reason && (e.reason.message || e.reason)); });
        setTimeout(function () {
          if (window.__nimbleBooted) return;
          var app = document.getElementById('app') || document.body;
          app.innerHTML =
            '<div style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:24px;background:#141414;color:#d9d9d9;font:16px/24px system-ui,sans-serif">' +
            '<strong style="font-size:22px;color:#c9f711">Nimble could not start</strong>' +
            '<span>Close the app and open it again. If this keeps happening, send a screenshot of this screen.</span>' +
            '<pre style="margin:0;padding:12px;border-radius:12px;background:#202022;color:#8b8b8b;white-space:pre-wrap;font:13px/18px ui-monospace,Menlo,monospace"></pre>' +
            '<button style="min-height:52px;border:0;border-radius:999px;background:#c9f711;color:#000;font-weight:800" onclick="location.reload()">Reload</button></div>';
          app.querySelector('pre').textContent = (first || 'The app did not start within 8 seconds.') + '\n' + navigator.userAgent;
        }, 8000);
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <div id="root"></div>
      <div id="overlays"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
